<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofolio Davin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Poppins',sans-serif;transition:background 0.5s,color 0.5s;overflow:hidden;}
  body.light{background: linear-gradient(135deg,#8EC5FC,#E0C3FC);color:#fff;}
  body.dark{background:#111;color:#fff;}

  section{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    overflow:hidden;
    color:#fff;
    padding:20px;
  }

  h1{
    font-size:3rem;
    margin-bottom:20px;
    z-index:2;
  }

  .info-card{
    background: rgba(0,0,0,0.3);
    padding:20px;
    margin:10px 0;
    border-radius:15px;
    max-width:500px;
    text-align:left;
    z-index:2;
  }

  .info-card h2{
    font-size:1.2rem;
    margin-bottom:10px;
  }

  .info-card p{
    font-size:1rem;
    line-height:1.5;
  }

  .toggle-mode{
    position:fixed;
    top:20px;
    right:20px;
    background: rgba(255,255,255,0.2);
    border:none;
    border-radius:50%;
    padding:10px;
    font-size:18px;
    cursor:pointer;
    z-index:3;
    color:white;
  }

  /* Bubble background */
  .bubbles{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
  }
  .bubble{
    position:absolute;
    bottom:-100px;
    background: rgba(255,255,255,0.3);
    border-radius:50%;
    animation: rise 15s infinite ease-in;
  }
  @keyframes rise{
    from {transform:translateY(0) scale(1); opacity:1;}
    to {transform:translateY(-120vh) scale(1.5); opacity:0;}
  }

  /* Tombol lagu */
  .audio-btn{
    margin-top: 20px;
    padding: 10px 25px;
    border-radius: 20px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;
    font-size:1rem;
  }
  .audio-btn:hover{
    background: rgba(255,255,255,0.35);
  }

  /* Notifikasi slide dari atas */
  #notif{
    position: fixed;
    top: -60px; /* mulai di atas layar */
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: #fff;
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 10;
    font-size: 1rem;
    opacity: 0;
    transition: all 0.5s ease;
  }
  #notif.show{
    top: 20px;
    opacity: 1;
  }
</style>
</head>
<body class="light">

<section>
  <div class="bubbles" id="bubbles"></div>
  <h1>Portofolio Davin</h1>

  <!-- Kotak info -->
  <div class="info-card">
    <h2>Profil</h2>
    <p><b>Nama:</b> Davin Dhanen</p>
    <p><b>Umur:</b> 13 tahun</p>
    <p><b>Sekolah:</b> SMP Al-Falah Ketintang Surabaya</p>
    <p><b>Hobi:</b> Bermain game, coding, membaca</p>
    <p><b>Cita-cita:</b> Menjadi orang kreatif & bermanfaat bagi orang lain</p>
  </div>

  <!-- Kotak kontak -->
  <div class="info-card">
    <h2>Kontak</h2>
    <p>WhatsApp / Telegram: @Apinzzz2</p>
  </div>

  <!-- Tombol Dark/Light -->
  <button class="toggle-mode" onclick="toggleDarkMode()">🌞</button>

  <!-- Tombol Lagu Favorit -->
  <button class="audio-btn" onclick="toggleAudio()">Lagu Favorit: Let Down</button>
  <audio id="favSong">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Browser anda tidak mendukung audio.
  </audio>
</section>

<!-- Notifikasi -->
<div id="notif">SELAMAT DATANG DI WEB APIN</div>

<script>
// Dark/Light toggle
function toggleDarkMode(){
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
  document.querySelector(".toggle-mode").textContent = document.body.classList.contains("dark")?"🌙":"🌞";
}

// Bubble generator
const container = document.getElementById("bubbles");
for(let i=0;i<20;i++){
  let bubble = document.createElement("div");
  bubble.classList.add("bubble");
  let size = Math.random()*40+10;
  bubble.style.width = bubble.style.height = size+"px";
  bubble.style.left = Math.random()*100+"%";
  bubble.style.animationDuration = (Math.random()*10+5)+"s";
  container.appendChild(bubble);
}

// Audio toggle
function toggleAudio(){
  const song = document.getElementById("favSong");
  if(song.paused){song.play();}else{song.pause();}
}

// Notifikasi slide dari atas
window.addEventListener('load', ()=>{
  const notif = document.getElementById("notif");
  notif.classList.add("show"); // munculkan notif
  setTimeout(()=>{ notif.classList.remove("show"); }, 3000); // hilang setelah 3 detik
});
</script>

</body>
</html>
